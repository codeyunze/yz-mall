name: Build and Push Service Images

on:
  workflow_dispatch: # 手动触发
  push:
    branches:
      - master
    paths:
      - 'mall-*/**'
      - 'Dockerfile'
      - '.github/workflows/build-and-push-services.yml'

concurrency:
  group: build-push-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 通过仓库 Variables 控制需要构建镜像的启动模块
        # 支持 artifactId 或相对路径，例如:
        #   ["mall-gateway","mall-sys-startup","mall-oms/mall-oms-startup"]
        # Settings -> Secrets and variables -> Actions -> Variables: DOCKER_SERVICES_JSON
        service: ${{ fromJSON(vars.DOCKER_SERVICES_JSON || '["mall-gateway"]') }}

    env:
      REGISTRY: registry.cn-guangzhou.aliyuncs.com
      NAMESPACE: devyunze
      GHCR_REGISTRY: ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve module path
        id: module
        run: |
          set -euo pipefail
          SERVICE="${{ matrix.service }}"
          # 支持相对路径（mall-admin/mall-sys-startup）或 artifactId（mall-sys-startup）
          if [ -d "$SERVICE" ]; then
            MODULE_DIR="$SERVICE"
          else
            MODULE_DIR="$(find . -type d -path "*/${SERVICE}" -not -path '*/target/*' -not -path '*/.git/*' | head -n 1 | sed 's|^\./||')"
          fi
          if [ -z "${MODULE_DIR}" ] || [ ! -d "${MODULE_DIR}" ]; then
            echo "::error::找不到模块目录: ${SERVICE}"
            exit 1
          fi
          MODULE_NAME="$(basename "${MODULE_DIR}")"
          # 推到当前仓库的 GHCR：ghcr.io/<owner>/<repo>/<服务名>（名须全小写）
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          NAME_LC="$(echo "${MODULE_NAME}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "dir=${MODULE_DIR}"
            echo "name=${MODULE_NAME}"
            echo "ghcr_image=${GHCR_REGISTRY}/${REPO_LC}/${NAME_LC}"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved ${SERVICE} -> ${MODULE_DIR} (${MODULE_NAME})"
          echo "GHCR image: ${GHCR_REGISTRY}/${REPO_LC}/${NAME_LC}"

      - name: Build ${{ steps.module.outputs.name }} jar with Maven
        run: mvn -B -DskipTests=true -pl ":${{ steps.module.outputs.name }}" -am package

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p .docker-build
          JAR="$(ls "${{ steps.module.outputs.dir }}/target/${{ steps.module.outputs.name }}"-*.jar 2>/dev/null | grep -v '\.original$' | head -n 1 || true)"
          if [ -z "${JAR}" ] || [ ! -f "${JAR}" ]; then
            echo "::error::未找到可执行 jar: ${{ steps.module.outputs.dir }}/target/${{ steps.module.outputs.name }}-*.jar"
            ls -la "${{ steps.module.outputs.dir }}/target/" || true
            exit 1
          fi
          cp "${JAR}" .docker-build/app.jar
          echo "Using jar: ${JAR}"

      - name: Set image version tag
        id: version
        run: echo "tag=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Alibaba Cloud Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          # 仅包含 app.jar，配合仓库根目录公共 Dockerfile
          context: .docker-build
          file: ./Dockerfile
          push: true
          # ACR 不支持 Buildx 默认附带的 OCI attestation（empty.v1+json），需关闭
          provenance: false
          sbom: false
          # 关联到当前 GitHub 仓库 Packages
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ steps.module.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ steps.module.outputs.name }}:${{ steps.version.outputs.tag }}
            ${{ steps.module.outputs.ghcr_image }}:latest
            ${{ steps.module.outputs.ghcr_image }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=docker-${{ steps.module.outputs.name }}
          cache-to: type=gha,mode=max,scope=docker-${{ steps.module.outputs.name }}
