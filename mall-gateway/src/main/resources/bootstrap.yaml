
spring:
  config:
    import:
      - optional:nacos:gateway.yaml
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: ${NACOS_HOST}:8848
      username: nacos
      password: ${NACOS_PASSWORD}
      config:
        namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
        import-check:
          enabled: false
        file-extension: yaml
        extension-configs:
          - data-id: mall-gateway.yaml
            refresh: true
          - data-id: middleware.yaml
          - data-id: sa-token.yaml
      discovery:
        namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
        ip: 192.168.3.20
    sentinel:
      # 保持 false：网关类型由 Sentinel SCG 自动配置在心跳前写入。eager=true 时心跳会先发出，控制台会把应用当成普通应用
#      eager: false
      # 关闭 Servlet 过滤器，网关走 SentinelGatewayFilter
      filter:
        enabled: false
      transport:
        dashboard: ${SENTINEL_DASHBOARD:192.168.3.237:8858}
        # Dashboard 向本机拉取/推送规则的端口，需对控制台所在机器可达
        port: 8719
        # 控制台回连网关的地址，须是 Dashboard 所在机器能访问的 IP
        client-ip: ${SENTINEL_CLIENT_IP:192.168.3.20}
      datasource:
        gw-api:
          nacos:
            server-addr: ${NACOS_HOST}:8848
            username: nacos
            password: ${NACOS_PASSWORD}
            namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
            group-id: DEFAULT_GROUP
            data-id: mall-gateway-gw-api.json
            data-type: json
            rule-type: gw-api-group
        gw-flow:
          nacos:
            server-addr: ${NACOS_HOST}:8848
            username: nacos
            password: ${NACOS_PASSWORD}
            namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
            group-id: DEFAULT_GROUP
            data-id: mall-gateway-gw-flow.json
            data-type: json
            rule-type: gw-flow
        degrade:
          nacos:
            server-addr: ${NACOS_HOST}:8848
            username: nacos
            password: ${NACOS_PASSWORD}
            namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
            group-id: DEFAULT_GROUP
            data-id: mall-gateway-degrade.json
            data-type: json
            rule-type: degrade
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: application/json
          response-body: '{"code":429,"msg":"请求过于频繁"}'