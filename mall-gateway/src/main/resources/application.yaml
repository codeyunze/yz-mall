
server:
  port: 25001

spring:
  application:
    name: mall-gateway

# MyBatis Mapper SQL 调试包（供 logback-spring.xml 读取；网关一般无本地 Mapper，可按需调整）
logging:
  mapper-package: com.yz.mall.sys.mapper

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      # Grafana JVM 仪表盘按 application 标签筛选，须与 spring.application.name 一致
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true