spring:
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      server-addr: ${NACOS_HOST}:8848
      username: nacos
      password: ${NACOS_PASSWORD}
      config:
        namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8
        import-check:
          enabled: false
        extension-configs:
          - data-id: middleware.yaml
          - data-id: sa-token.yaml
      discovery:
        namespace: ff6944dd-b11f-4403-8245-6c621b2f54c8


# 执行器 address/port：未配置 port 时由 mall-job 按 server.port+100 计算
xxl:
  job:
    executor:
      appname: ${spring.application.name}
      ip: 192.168.3.20

rocketmq:
  producer:
    group: producer-mall-pms
  consumer:
    group: consumer-mall-pms
