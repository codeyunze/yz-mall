
server:
  port: 25004

spring:
  application:
    name: mall-pms

# MyBatis Mapper SQL 调试包（供 logback-spring.xml 读取）
logging:
  mapper-package: com.yz.mall.pms.mapper

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      # Grafana JVM 仪表盘按 application 标签筛选，须与 spring.application.name 一致
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true