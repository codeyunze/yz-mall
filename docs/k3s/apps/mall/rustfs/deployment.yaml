apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: mall
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: yz-mall
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        app.kubernetes.io/part-of: yz-mall
    spec:
      # local-path 为 WaitForFirstConsumer：勿用 nodeName（会跳过调度器导致 PVC 永不绑定）
      nodeSelector:
        kubernetes.io/hostname: vm-master-01
      imagePullSecrets:
        - name: acr-gz
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: prepare-dirs
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /data /logs
              chown -R 10001:10001 /data /logs
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      containers:
        - name: rustfs
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/rustfs:1.0.0-rc.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - configMapRef:
                name: rustfs-config
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: secret-key
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
          readinessProbe:
            httpGet:
              path: /health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          persistentVolumeClaim:
            claimName: rustfs-logs
