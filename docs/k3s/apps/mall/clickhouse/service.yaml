apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: mall
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: yz-mall
spec:
  # 集群内：clickhouse.mall.svc.cluster.local:8123（HTTP/JDBC） / :9000（native）
  type: ClusterIP
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
