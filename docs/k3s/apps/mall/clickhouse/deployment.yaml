apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: mall
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: yz-mall
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: yz-mall
    spec:
      # local-path 为 WaitForFirstConsumer：勿用 nodeName
      # 放在相对空闲的 worker-02，避免与 master 上 rustfs 抢盘
      nodeSelector:
        kubernetes.io/hostname: vm-worker-02
      imagePullSecrets:
        - name: acr-gz
      securityContext:
        fsGroup: 101
      initContainers:
        - name: prepare-dirs
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /var/lib/clickhouse /var/log/clickhouse-server
              chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
      containers:
        - name: clickhouse
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/clickhouse-server:26.4.5.143
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          env:
            - name: CLICKHOUSE_DB
              value: tw
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: password
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 200m
            limits:
              memory: 1536Mi
              cpu: "1"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
        - name: logs
          persistentVolumeClaim:
            claimName: clickhouse-logs
        - name: init
          configMap:
            name: clickhouse-init
