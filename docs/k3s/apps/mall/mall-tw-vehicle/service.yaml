apiVersion: v1
kind: Service
metadata:
  name: mall-tw-vehicle
  namespace: mall-business
  labels:
    app.kubernetes.io/name: mall-tw-vehicle
spec:
  # 对应 docker -p 25005:8080；集群内用 ClusterIP。
  # 若要节点外网访问，改为 type: NodePort，并设 nodePort: 32005（须在 30000-32767）。
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mall-tw-vehicle
  ports:
    - name: http
      port: 25005
      targetPort: 8080
