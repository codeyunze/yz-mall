apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-gateway
  namespace: mall
  labels:
    app.kubernetes.io/name: mall-gateway
    app.kubernetes.io/part-of: yz-mall
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mall-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mall-gateway
        app.kubernetes.io/part-of: yz-mall
    spec:
      imagePullSecrets:
        - name: acr-gz
      containers:
        - name: mall-gateway
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/mall-gateway:202609061808
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 25001
              name: http
          env:
            - name: NACOS_HOST
              value: nacos.mall.svc.cluster.local
            - name: NACOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nacos-secret
                  key: password
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: TZ
              value: Asia/Shanghai
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 25001
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 25001
            initialDelaySeconds: 120
            periodSeconds: 20
