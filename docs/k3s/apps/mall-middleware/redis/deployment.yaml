apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mall-middleware
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: yz-mall
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: yz-mall
    spec:
      imagePullSecrets:
        - name: acr-gz
      containers:
        - name: redis
          image: registry.cn-guangzhou.aliyuncs.com/devyunze/redis:7.4.5
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: requirepass
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 640Mi
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
