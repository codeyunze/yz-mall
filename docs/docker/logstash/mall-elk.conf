input {
	tcp {
		host => "0.0.0.0"
		port => "4560"
		mode => "server"
		codec => json_lines
	}
	# 网关访问日志：Topic/tag=log-gateway-access；consumer group 标明 logstash；容器内连 kafka:9092
	kafka {
		bootstrap_servers => "kafka:9092"
		topics => ["log-gateway-access"]
		group_id => "logstash-log-gateway-access"
		client_id => "logstash-log-gateway-access"
		codec => json
		auto_offset_reset => "earliest"
		consumer_threads => 1
		tags => ["log-gateway-access"]
	}
}

filter {
	if "log-gateway-access" in [tags] {
		date {
			match => ["requestTime", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss"]
			target => "@timestamp"
		}
	}
}

# 索引名：mall_20260725（与历史 mall_YYYYMMdd 一致）
# 网关访问日志：log-gateway-access_YYYYMMdd，模板 log-gateway-access-template 同样挂 mall-logs-3d（3 天后删）
# 保留 3 天由 ES 侧 ILM 策略 mall-logs-3d 负责，这里必须关掉 Logstash 自带 ILM，
# 否则 Logstash 8 默认 ilm_enabled=auto 会忽略 index，改写到 rollover 别名，表现为“写不进 mall-*”
output {
	stdout {
		codec => rubydebug
	}
	if "log-gateway-access" in [tags] {
		elasticsearch {
			hosts => ["http://elasticsearch:9200"]
			index => "log-gateway-access_%{+YYYYMMdd}"
			ilm_enabled => false
		}
	} else {
		elasticsearch {
			hosts => ["http://elasticsearch:9200"]
			index => "%{[platform]}%{+_YYYYMMdd}"
		}
	}
}
