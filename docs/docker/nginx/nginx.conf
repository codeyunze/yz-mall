worker_processes auto;
# OpenResty alpine 镜像无 /var/log/nginx，日志走官方目录或标准输出
error_log /usr/local/openresty/nginx/logs/error.log warn;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';
    access_log /usr/local/openresty/nginx/logs/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # Docker 内嵌 DNS；Lua cosocket 访问 skywalking-oap 必须显式声明
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SkyWalking Nginx Lua Agent
    lua_package_path "/usr/local/skywalking-nginx-lua/lib/?.lua;;";
    lua_shared_dict tracing_buffer 100m;

    init_worker_by_lua_block {
        local metadata_buffer = ngx.shared.tracing_buffer
        metadata_buffer:set("serviceName", "mall-nginx")
        metadata_buffer:set("serviceInstanceName", "dev-openresty-1.31.1.1")
        metadata_buffer:set("includeHostInEntrySpan", false)

        require("skywalking.util").set_randomseed()
        -- alpine 环境缺 tablepool 时关闭，避免启动报错
        require("skywalking.util").disable_tablepool()

        local oap = os.getenv("SW_OAP") or "http://skywalking-oap:12800"
        require("skywalking.client"):startBackendTimer(oap)
        skywalking_tracer = require("skywalking.tracer")
    }

    include /etc/nginx/conf.d/*.conf;
}
