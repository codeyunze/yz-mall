# mall-gateway 上游：按实际实例增删；端口以应用 server.port 为准
upstream mall_gateway {
    # least_conn;
    # ip_hash;
    server 192.168.3.20:5001 max_fails=3 fail_timeout=10s;
    # server 192.168.3.21:5001 max_fails=3 fail_timeout=10s;
}

server {
    listen 5000;
    server_name _;

    client_max_body_size 50m;

    location / {
        rewrite_by_lua_block {
            -- 下游在 SkyWalking 拓扑中的逻辑服务名（非真实 IP）
            skywalking_tracer:start("mall-gateway")
        }

        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        body_filter_by_lua_block {
            if ngx.arg[2] then
                skywalking_tracer:finish()
            end
        }

        log_by_lua_block {
            skywalking_tracer:prepareForReport()
        }
    }

    # 健康检查：不进入 SkyWalking 链路
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
