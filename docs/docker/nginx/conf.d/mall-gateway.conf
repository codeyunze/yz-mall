# mall-gateway 上游：按实际实例增删；端口以应用 server.port 为准（默认 25001）
upstream mall_gateway {
    # least_conn;          # 可选：最少连接
    # ip_hash;             # 可选：会话粘滞
    server 192.168.3.20:5001 max_fails=3 fail_timeout=10s;
    # server 192.168.3.21:5001 max_fails=3 fail_timeout=10s;
}

server {
    listen 5000;
    server_name _;

    client_max_body_size 50m;

    location / {
        proxy_pass http://mall_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查：nginx 自身存活（不转发到 gateway）
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
