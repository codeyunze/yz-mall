server:
  port: 10103

spring:
  application:
    name: mall-kafka-demo

  kafka:
    # Docker 部署时须连 EXTERNAL 端口（9094），勿连 9092（元数据会返回容器内主机名 kafka）
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:192.168.3.237:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: mall-kafka-demo-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.yz.mall.demo.kafka.common
        spring.json.value.default.type: com.yz.mall.demo.kafka.common.OrderEventMessage
