server:
  port: 31002

spring:
  application:
    name: mall-seata-order

# MyBatis Mapper SQL 调试包（供 logback-spring.xml 读取）
logging:
  mapper-package: com.yz.mall.so.mapper

app:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    url: jdbc:mysql://${MYSQL_HOST}:3306/mall_seata_order?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF8&useSSL=false&allowMultiQueries=true
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 192.168.3.237
      port: 6379
      password: ${REDIS_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
