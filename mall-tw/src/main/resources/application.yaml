server:
  port: 5005

spring:
  application:
    name: mall-tw
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true

logging:
  mapper-package: com.yz.mall.tw

tw:
  vehicle:
    max-auth-users: 10
  # 遥测与轨迹（节点 0 占位；CH/Kafka 默认关闭，保证无中间件也可启动）
  telemetry:
    kafka:
      enabled: true
      topic: tw-telemetry-raw
      group-id: tw-telemetry-gps
      speed-jump-filter: true
      max-speed-kmh: 250
    clickhouse:
      enabled: true
      url: jdbc:clickhouse://${CLICKHOUSE_HOST:127.0.0.1}:${CLICKHOUSE_PORT:8123}/tw
      username: ${CLICKHOUSE_USER:default}
      password: ${CLICKHOUSE_PASSWORD:}
    track:
      max-query-hours: 24
      default-max-points: 2000
      absolute-max-points: 5000
      batch-size: 1000
      flush-interval-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

rocketmq:
  producer:
    group: producer-${spring.application.name}
  consumer:
    group: consumer-${spring.application.name}
