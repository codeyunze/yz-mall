server:
  port: 25005

spring:
  application:
    name: mall-tw

logging:
  mapper-package: com.yz.mall.tw

tw:
  vehicle:
    max-auth-users: 10

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

rocketmq:
  producer:
    group: producer-${spring.application.name}
  consumer:
    group: consumer-${spring.application.name}
